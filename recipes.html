<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <h1 class="title">Your Recipes 🍴</h1>

    <p class="hint">Have a specific cuisine in mind?</p>

    <div class="cuisine-buttons">
      <button data-cuisine="african">Africa</button>
      <button data-cuisine="european">Europe</button>
      <button data-cuisine="asian">Asia</button>
      <button data-cuisine="american">America</button>
      <button data-cuisine="">All</button> 
    </div>

    <div id="recipe-list" class="recipe-list">
      
    </div>

    <div style="margin-top: 20px;">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>

  <script>
    const flavor = localStorage.getItem('flavor')?.toLowerCase() || '';
    const recipeList = document.getElementById('recipe-list');
    const apiKey = 'f1b05b9074ef43fe9033ab708f8cd9d8';
  
    function fetchRecipes(cuisine = '') {
      recipeList.innerHTML = ''; // Clear previous results
  
      const offset = Math.floor(Math.random() * 50); // Randomize offset (adjust range as needed)
  
      let apiURL = `https://api.spoonacular.com/recipes/complexSearch?query=${flavor}&number=3&offset=${offset}&apiKey=${apiKey}`;
  
      if (cuisine && cuisine !== 'all') {
        apiURL += `&cuisine=${cuisine}`;
      }
  
      fetch(apiURL)
        .then(res => res.json())
        .then(data => {
          const meals = data.results || [];
  
          if (meals.length === 0) {
            recipeList.innerHTML = "<p>No recipes found! Try another flavor or cuisine.</p>";
            return;
          }
  
          meals.forEach(meal => {
            const mealDiv = document.createElement('div');
            mealDiv.classList.add('recipe-card');
            mealDiv.innerHTML = `
              <img src="https://spoonacular.com/recipeImages/${meal.id}-480x360.jpg" alt="${meal.title}" style="width:100%; border-radius:10px;">
              <h2>${meal.title}</h2>
              <button onclick="viewRecipe(${meal.id})">View Recipe</button>
            `;
            recipeList.appendChild(mealDiv);
          });
        })
        .catch(error => {
          console.error('Error fetching recipes:', error);
          recipeList.innerHTML = "<p>Oops! Couldn't load recipes.</p>";
        });
    }
  
    function viewRecipe(id) {
      fetch(`https://api.spoonacular.com/recipes/${id}/information?apiKey=${apiKey}`)
        .then(res => res.json())
        .then(data => {
          if (data.sourceUrl) {
            window.open(data.sourceUrl, '_blank');
          } else {
            alert('Recipe link not found.');
          }
        })
        .catch(error => {
          console.error('Error fetching recipe details:', error);
          alert('An error occurred while fetching the recipe.');
        });
    }
  
    // Add event listeners to cuisine buttons
    document.querySelectorAll('.cuisine-buttons button').forEach(btn => {
      btn.addEventListener('click', () => {
        const cuisine = btn.getAttribute('data-cuisine');
        fetchRecipes(cuisine);
      });
    });
  
    // Add a refresh button listener
    const refreshBtn = document.createElement('button');
    refreshBtn.textContent = '🔄 Show Me More';
    refreshBtn.style.marginTop = '20px';
    refreshBtn.onclick = () => fetchRecipes(); // just call it again
    document.querySelector('.container').appendChild(refreshBtn);
  
    // Initial fetch
    fetchRecipes();
  </script>
  
    
</body>
</html>
